<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bridge Arcson Security</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" href="src/Logos/FaviconBridgeArcson.png" type="image/png">

</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <!-- LOGO -->

        <div class="logo-container">

            <img src="src/Logos/LogoBridgeArcson.png" 
                 alt="Bridge Arcson Logo"
                 class="logo-image">

            <div class="logo-text">

                <h2 class="logo-title">
                    BRIDGE ARCSON
                </h2>

                <p class="logo-subtitle">
                    SECURITY SYSTEM
                </p>

            </div>

        </div>

        <!-- MENU -->

        <nav class="menu">

            <!-- MONITOREO -->

            <div class="menu-category">
                MONITOREO
            </div>

            <ul>

                <li>
                    <a href="#" class="active">
                        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        Panel de control
                    </a>
                </li>
            </ul>
        </nav>
        <!-- FOOTER -->

        <div class="sidebar-footer">
            © 2026 Bridge Arcson
        </div>

    </aside>

    <!-- CONTENIDO -->

    <main class="main-content">

        <!-- TOPBAR -->

        <header class="topbar">

            <!-- LEFT -->

            <div class="topbar-left">

                <h1>
                    Centro de Monitoreo
                </h1>

            </div>

            <!-- RIGHT -->

            <div class="topbar-right">

                <!-- FECHA Y HORA -->

                <div class="datetime">

                    <span id="date"></span>

                    <span id="clock"></span>

                </div>

                <!-- EN VIVO -->

                <div class="live-system" id="conexion">
                    FUERA DE LINEA
                </div>

                <!-- USUARIO -->

                <div class="user-circle">

                    AB

                </div>

            </div>

        </header>

        <!-- CARDS -->

        <section class="cards-container">

            <div class="status-card" id="card-sensor">

                <h3>
                    Estado del Sensor PIR
                </h3>

                <p class="status danger-status" id="status-sensor">
                    Desactivado
                </p>


            </div>

            <div class="status-card" id="card-cerrojo">

                <h3>
                    Estado del Cerrojo
                </h3>

                <p class="status danger-status" id="status-cerrojo">
                    Abierto
                </p>

            </div>

            <div class="status-card">

                <h3>
                    Estado del Servidor
                </h3>

                <p class="status online-status" id="online-status">
                    Offline
                </p>

                <div class="card-spacer"></div>

            </div>

        </section>

        <!-- CAMARA -->

        <section class="camera-section" id="camaras">

            <div class="section-header">

                <h2>
                    Cámara Principal
                </h2>

                <span class="live-badge">
                    EN VIVO
                </span>

            </div>

            <img class="camera-box" alt="STREAM DE VIDEO" src="http://192.168.0.23:3000/camera/stream" crossorigin>

            </img>

        </section>

    </main>

    <!-- SOCKET.IO -->
    <script src="http://192.168.0.23:3000/socket.io/socket.io.js"></script>

    <!-- SCRIPT FECHA Y HORA -->

    <script type="module">
        const socket = io("ws://192.168.0.23:3000");

        socket.on("connect",()=>{
            const conexion =document.getElementById('conexion');
            document.getElementById('online-status').style.color = '#00FF9C';
            document.getElementById('online-status').innerText= "Online"
            conexion.innerText= "EN VIVO"
            conexion.style.color = "#00FF9C"
        });

        socket.on("disconnect",()=>{
            document.getElementById('online-status').style.color = '#FF0000';
            document.getElementById('online-status').innerText= "Offline"
            conexion.innerText= "FUERA DE LINEA"
            conexion.style.color = "#FF0000"
        });

        socket.on("movimiento",(msg)=>{
            const status = document.getElementById('status-sensor');
            const label = document.getElementById('label-sensor');
            if(msg == 'ON'){
                status.textContent = 'Activado';
                status.className = 'status active-status';
                label.textContent = 'Activado';
            } else {
                status.textContent = 'Desactivado';
                status.className = 'status danger-status';
                label.textContent = 'Desactivado';
            }
        });

        socket.on("cerrojo",(msg)=>{
            const status = document.getElementById('status-cerrojo');
            const label = document.getElementById('label-cerrojo');
            if(msg == 'ON'){
                status.textContent = 'Cerrado';
                status.className = 'status active-status';
                label.textContent = 'Cerrado';
            } else {
                status.textContent = 'Abierto';
                status.className = 'status danger-status';
                label.textContent = 'Abierto';
            }
        });

        function updateClock(){

            const now = new Date();

            const date = now.toLocaleDateString('es-AR', {

                weekday:'short',

                day:'numeric',

                month:'short',

                year:'numeric'
            });

            const time = now.toLocaleTimeString('es-AR');

            document.getElementById('date').innerHTML = date;

            document.getElementById('clock').innerHTML = time;
        }

        setInterval(updateClock, 1000);

        updateClock();

        // TOGGLE SENSOR
        document.getElementById('toggle-sensor').addEventListener('change', function(){
            const status = document.getElementById('status-sensor');
            const label = document.getElementById('label-sensor');
            if(this.checked){
                status.textContent = 'Activado';
                status.className = 'status active-status';
                label.textContent = 'Activado';
            } else {
                status.textContent = 'Desactivado';
                status.className = 'status danger-status';
                label.textContent = 'Desactivado';
            }
        });

        // TOGGLE CERROJO
        document.getElementById('toggle-cerrojo').addEventListener('change', function(){
            const status = document.getElementById('status-cerrojo');
            const label = document.getElementById('label-cerrojo');
            if(this.checked){
                status.textContent = 'Cerrado';
                status.className = 'status active-status';
                label.textContent = 'Cerrado';
                socket.emit('cerrar', true);
            } else {
                status.textContent = 'Abierto';
                status.className = 'status danger-status';
                label.textContent = 'Abierto';
                socket.emit('abrir', true);
            }
        });

    </script>

</body>
</html>
